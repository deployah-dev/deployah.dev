name = "deployah-dev"
main = "src/index.ts"
compatibility_date = "2026-07-29"

routes = [
  { pattern = "deployah.dev", custom_domain = true }
]

# Worker runs first so /?go-get=1 is not served as index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "deployah"
