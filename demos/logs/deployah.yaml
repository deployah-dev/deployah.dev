apiVersion: v1-alpha.5
project: app
components:
  web:
    role: worker
    image: nginx:1.26
    environments: [local]
    command: ["/bin/sh", "-c"]
    args: ["while true; do echo $(hostname); sleep 2; done"]
  worker:
    role: worker
    image: nginx:1.26
    environments: [local]
    command: ["/bin/sh", "-c"]
    args: ["sleep 1; while true; do echo $(hostname); sleep 2; done"]
